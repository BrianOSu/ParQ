name: C++ tests

on:
  push:
  pull_request:

jobs:
  handle-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S .
      - name: Build handle test
        run: cmake --build build --target k_handles_test
      - name: Run standalone q handle tests
        run: ctest --test-dir build --output-on-failure -R '^k_handles_test$'
